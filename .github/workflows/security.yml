name: XusGuard security and offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: xusguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 pinned
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python sources
        run: python -m compileall -q xusguard.py xusguard_gui.py xusguard_recovery.py xusguard_preview.py tests scripts
      - name: Offline security and functional tests
        run: python -m unittest discover -s tests -v
      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

  live-feed-audit:
    name: Verify bundled third-party feeds (read-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # pinned v6
        with:
          python-version: '3.12'
      - name: Check each HTTPS feed without altering system hosts
        run: python scripts/verify_feeds.py --output feed-audit.json
      - name: Publish read-only feed audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: xusguard-feed-audit
          path: feed-audit.json
          if-no-files-found: warn
