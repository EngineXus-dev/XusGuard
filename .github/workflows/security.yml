name: XusGuard security and offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python sources
        run: python -m compileall -q xusguard.py tests
      - name: Offline security and functional tests
        run: python -m unittest discover -s tests -v
      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh
